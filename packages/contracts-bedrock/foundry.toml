################################################################
#                   PROFILE: DEFAULT (local)                   #
################################################################

[profile.default]
# 源码/脚本目录
src   = 'src'
script = 'scripts'

#   forge clean && forge build -vvv
out = 'forge-artifacts'

# Hardhat 风格的 build-info 放在 artifacts/build-info（保持不变，很多工具依赖）
build_info_path = 'artifacts/build-info'

optimizer = true
optimizer_runs = 999999
use_literal_content = true


# IMPORTANT:
# 当新增编译profiles或限制时，LITE 配置也要同步，保证覆盖编译不需要清理 build 目录
additional_compiler_profiles = [
  { name = "dispute", optimizer_runs = 5000 },
]
compilation_restrictions = [
  { paths = "src/dispute/FaultDisputeGame.sol", optimizer_runs = 5000 },
  { paths = "src/dispute/PermissionedDisputeGame.sol", optimizer_runs = 5000 },
  { paths = "src/L1/OPContractsManager.sol", optimizer_runs = 5000 },
  { paths = "src/L1/OPContractsManagerStandardValidator.sol", optimizer_runs = 5000 },
  { paths = "src/L1/OptimismPortal2.sol", optimizer_runs = 5000 }
]

extra_output   = ['devdoc', 'userdoc', 'metadata', 'storageLayout']
bytecode_hash  = 'none'
ast            = true
evm_version    = 'cancun'

remappings = [
  '@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts',
  '@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts',
  '@openzeppelin/contracts-v5/=lib/openzeppelin-contracts-v5/contracts',
  '@rari-capital/solmate/=lib/solmate',
  '@lib-keccak/=lib/lib-keccak/contracts/lib',
  '@solady/=lib/solady/src',
  '@solady-v0.0.245/=lib/solady-v0.0.245/src',
  'forge-std/=lib/forge-std/src',
  'ds-test/=lib/forge-std/lib/ds-test/src',
  'safe-contracts/=lib/safe-contracts/contracts',
  'kontrol-cheatcodes/=lib/kontrol-cheatcodes/src',
  'interfaces/=interfaces',
  'op-contracts-universal/=src/universal/'
]

# 允许 Foundry 脚本读取/写入的路径（vm.readFile / vm.getCode 等）
# - 明确允许读取 forge-artifacts（Foundry 产物）与 artifacts（Hardhat 产物 & build-info）
fs_permissions = [
  { access = 'read-write',       path = '/home/ubuntu/apertium-l2/generated/' },
  { access = 'read-write', path = './.resource-metering.csv' },
  { access = 'read-write', path = './snapshots/' },
  { access = 'read-write', path = './deployments/' },
  { access = 'read-write', path = './generated'},
  { access = 'read-write', path = './deployments/getting-started/' },
  { access = 'read',       path = './deploy-config/' },
  { access = 'read',       path = './deploy-config-periphery/' },
  { access = 'read',       path = './broadcast/' },
  
  # 关键：Foundry 产物目录（与 out 保持一致）
  { access = 'read',       path = './forge-artifacts/' },

  # 关键：Hardhat 目录以及 build-info（若脚本读取 build-info/或其他工具依赖）
  { access = 'read',       path = './artifacts/' },
  { access = 'read',       path = './artifacts/build-info' },

  { access = 'read-write', path = './.testdata/' },
  { access = 'read',       path = './kout-deployment' },
  { access = 'read',       path = './test/fixtures' },
  { access = 'read',       path = './lib/superchain-registry/superchain/configs/' },
  { access = 'read',       path = './lib/superchain-registry/validation/standard/' },
]

# 5159 是 selfdestruct 的错误码（忽略）
ignored_error_codes = ["transient-storage", "code-size", "init-code-size", 5159]
ffi = true

# 提高本地测试 gas 上限
gas_limit = 9223372036854775807

[fuzz]
runs = 64

[fmt]
line_length = 120
multiline_func_header = 'all'
bracket_spacing = true
wrap_comments = true

[profile.scripts]
optimizer = false
via_ir = true
# 只编译入口脚本真正 import 的文件，避免把一堆 test/工具链也带进来
sparse_mode = true
# 较少无关信息 & 规避与部分源码的 metadata 交互
bytecode_hash = "none"
# 可选：加快编译
fs_permissions = [{ access = "read", path = "./" }]


################################################################
#                         PROFILE: CI                          #
################################################################

[profile.ci.fuzz]
runs = 128

[profile.ci.invariant]
runs = 64
depth = 32

################################################################
#                     PROFILE: CICOVERAGE                      #
################################################################

[profile.cicoverage]
optimizer = false
compilation_restrictions = []

[profile.cicoverage.fuzz]
runs = 1

[profile.cicoverage.invariant]
runs = 1
depth = 1

################################################################
#                       PROFILE: CIHEAVY                       #
################################################################

[profile.ciheavy.fuzz]
runs = 20000
timeout = 300

[profile.ciheavy.invariant]
runs = 128
depth = 512
timeout = 300

################################################################
#                         PROFILE: LITE                        #
################################################################

[profile.lite]
optimizer = false

# IMPORTANT:
# 与 default 保持编译限制一致（优化开关为 0）
additional_compiler_profiles = [
  { name = "dispute", optimizer_runs = 0 },
]
compilation_restrictions = [
  { paths = "src/dispute/FaultDisputeGame.sol", optimizer_runs = 0 },
  { paths = "src/dispute/PermissionedDisputeGame.sol", optimizer_runs = 0 },
  { paths = "src/L1/OPContractsManager.sol", optimizer_runs = 0 },
  { paths = "src/L1/OPContractsManagerStandardValidator.sol", optimizer_runs = 0 },
  { paths = "src/L1/OptimismPortal2.sol", optimizer_runs = 0 },
]

################################################################
#                         PROFILE: KONTROL                     #
################################################################

[profile.kprove]
src   = 'test/kontrol/proofs'
out   = 'kout-proofs'
test  = 'test/kontrol/proofs'
script = 'test/kontrol/proofs'

[profile.deploy]
via_ir = true

[profile.exec]
via_ir = false

[rpc_endpoints]
holesky = "https://ethereum-holesky.publicnode.com"

[profile.executor]
# 关键：让本 profile 的 src 只指向一个几乎空目录，避免编译整个 src/
src = "scripts/executor-src"

optimizer = true
optimizer_runs = 200
via_ir = true
auto_detect_solc = true
# 继承默认 remappings（不要在此 profile 覆盖 remappings；保持能找到 interfaces/ 与 forge-std/）
